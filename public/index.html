<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- 可以安裝到主畫面（PWA）：Android 的 Chrome 看 manifest，iPhone 的 Safari 看 apple-touch-icon -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#FBF7FF" />
    <meta name="apple-mobile-web-app-title" content="貼貼公布欄" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 一打開就先跟會用到的伺服器連線（字型、資料庫、LINE 登入），等 JS 下載完時已經連好了 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://api.line.me" />
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <!-- 粉圓體：Google Fonts 切成很多小檔，只下載畫面上用到的字；不擋住畫面，下載好之前先用系統字型（src/lib/fonts.ts） -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" media="print" onload="this.media='all'" />
    <script>
      // Chrome「可以安裝了」的通知可能在 App 載入完之前就來，先接住，
      // 等使用者按「安裝」再跳出來（src/features/settings/install.ts）
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPrompt = e;
      });
      window.addEventListener('appinstalled', function () {
        window.__installPrompt = undefined;
      });
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      body {
        margin: 0;
        background: #fbf7ff;
      }
      /* JS 還在下載時先顯示的開場畫面（React 畫出來時會整個換掉） */
      #boot {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #fbf7ff;
        font-family: Huninn, sans-serif;
        color: #4b3f6b;
        font-size: 18px;
      }
      #boot img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        animation: boot-bob 1.2s ease-in-out infinite;
      }
      @keyframes boot-bob {
        50% {
          transform: translateY(-6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div id="boot">
        <img src="/icons/icon-192.png" alt="" />
        <div>貼貼公布欄</div>
      </div>
    </div>
  </body>
</html>
